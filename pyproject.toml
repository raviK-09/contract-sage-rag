[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-sage"
version = "0.1.0"
description = "AI-powered legal contract Q&A with source citations, confidence scoring, and RAGAS evaluation — zero API cost"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["rag", "nlp", "legal", "langchain", "chromadb", "ollama", "ragas"]

# ── Core RAG dependencies ──────────────────────────────────────────────────────
dependencies = [
  # Framework
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.2.0",          # Ollama integration (OpenAI-compatible)
  "langchain-huggingface>=0.1.0",     # HuggingFace embeddings

  # Vector store
  "chromadb>=0.5.0",

  # Embeddings (local, zero-cost)
  "sentence-transformers>=3.0.0",

  # Sparse retrieval (BM25 for hybrid search)
  "rank-bm25>=0.2.2",

  # Document ingestion
  "pypdf>=4.0.0",                     # PDF loading
  "beautifulsoup4>=4.12.0",           # HTML scraping for URL ingestion
  "requests>=2.31.0",
  "lxml>=5.0.0",                      # HTML parser backend

  # Configuration
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",

  # API
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",          # File upload support

  # UI
  "streamlit>=1.38.0",
  "plotly>=5.24.0",                   # Charts for eval dashboard

  # Evaluation (install separately: pip install -e ".[eval]")
  # Note: ragas has strict langchain version pins — installed in Phase 6
  # "ragas>=0.2.0",
  # "datasets>=2.20.0",
]

# ── Optional / dev dependencies ────────────────────────────────────────────────
[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",                      # Linter + formatter (replaces flake8 + black)
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
  "httpx>=0.27.0",                    # For testing FastAPI endpoints
]

[project.scripts]
# CLI entry points
seed-data   = "scripts.seed_data:main"
run-eval    = "scripts.run_eval:main"
serve-api   = "app.api.main:start"

# ── Ruff configuration ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy configuration ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

# ── Pytest configuration ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

# ── Setuptools package discovery ───────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
